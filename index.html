<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - Home</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <!-- CSS Files -->
    <link rel="stylesheet" href="./css/base.css?v=2" />
    <link rel="stylesheet" href="./css/index.css" />
  </head>

  <body>
    <header>
      <nav class="container">
        <a href="index.html" class="logo">
          <div class="logo-code">
            <span class="bracket">&lt;</span>
            <span class="name">negar</span>
            <span class="bracket">/&gt;</span>
          </div>
        </a>

        <button type="button" class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle menu" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <ul class="nav-menu">
          <li><a href="index.html" class="active">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="tech-stack.html">Tech Stack</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li>
            <a
              href="https://negarbaharmand.netlify.app/"
              target="_self"
              class="blog-link"
            >
              Blog <i class="fas fa-external-link-alt"></i>
            </a>
          </li>

          <li class="social-links">
            <a
              href="https://github.com/negarbaharmand"
              target="_blank"
              aria-label="GitHub"
            >
              <i class="fab fa-github"></i>
            </a>
            <a
              href="https://twitter.com/negarbaharmand"
              target="_blank"
              aria-label="Twitter"
            >
              <i class="fab fa-twitter"></i>
            </a>
            <a
              href="https://www.linkedin.com/in/negarbaharmand/"
              target="_blank"
              aria-label="LinkedIn"
            >
              <i class="fab fa-linkedin-in"></i>
            </a>
            <button id="theme-toggle" aria-label="Toggle dark mode">
              <i class="fas fa-moon"></i>
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="hero terminal-hero" aria-label="Terminal introduction">
        <div class="terminal-hero-bg" aria-hidden="true"></div>
        <div class="terminal-container container">
          <div class="terminal-window">
            <div class="terminal-titlebar" aria-hidden="true">
              <span class="terminal-dots">
                <span></span><span></span><span></span>
              </span>
              <span class="terminal-title">negar@portfolio — bash</span>
            </div>
            <div class="terminal-body">
              <div
                id="terminal-output"
                class="terminal-output"
                role="log"
                aria-live="polite"
              ></div>
              <div class="terminal-current-line">
                <span class="terminal-prompt">negar@portfolio ~ $</span>
                <span id="terminal-command" class="terminal-command"></span>
                <span
                  id="terminal-cursor"
                  class="terminal-cursor"
                  aria-hidden="true"
                  >▌</span
                >
              </div>
            </div>
          </div>
          <p
            class="terminal-cta-wrap"
            id="terminal-cta-wrap"
            aria-hidden="true"
          >
            <a href="projects.html" class="terminal-cta" id="terminal-cta" tabindex="-1"
              >cd projects</a
            >
          </p>
        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        <p>
          Designed and built by <span>Negar B</span> with
          <span class="love">Love</span> & <span class="coffee">Coffee</span>
        </p>
      </div>
    </footer>

    <script>
      function toggleMenu() {
        const navMenu = document.querySelector(".nav-menu");
        const btn = document.querySelector(".menu-toggle");
        navMenu.classList.toggle("active");
        if (btn) btn.setAttribute("aria-expanded", navMenu.classList.contains("active"));
      }
    </script>
    <script src="./js/theme.js"></script>
    <script src="./js/terminal-typing.js"></script>
  </body>
</html>
